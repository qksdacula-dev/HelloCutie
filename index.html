<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Something 💗</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at 20% 20%, #fff0f6 0%, transparent 25%),
        radial-gradient(circle at 80% 80%, #ffe4ef 0%, transparent 30%),
        linear-gradient(135deg, #ffc9de, #ffdce8);

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;
    }

    /* Main content */

    #content {
      width: 90%;
      max-width: 800px;

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;

      z-index: 10;
    }

    .question {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: bold;

      color: #1f1f1f;

      text-shadow:
        2px 2px 8px rgba(255, 105, 180, 0.35);

      padding: 20px;

      max-width: 800px;

      animation: questionAppear 0.8s ease;
    }

    @keyframes questionAppear {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.9);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Pictures */

    .sticker {
      width: 180px;
      height: 180px;

      margin-top: 15px;

      object-fit: contain;

      animation: stickerAppear 0.7s ease;
    }

    @keyframes stickerAppear {
      0% {
        opacity: 0;
        transform: scale(0.5) rotate(-5deg);
      }

      70% {
        transform: scale(1.1) rotate(3deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    /* Final message */

    .final {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: bold;

      color: #1f1f1f;

      padding: 20px;

      text-shadow:
        2px 2px 10px rgba(255, 70, 120, 0.4);

      animation: finalReveal 1.2s ease;
    }

    @keyframes finalReveal {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }

      70% {
        transform: scale(1.08);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Next button */

    button {
      margin-top: 30px;

      padding: 13px 35px;

      border: none;
      border-radius: 30px;

      background: #ff5c85;
      color: white;

      font-size: 1.15rem;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 6px 20px rgba(255, 92, 133, 0.35);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    button:hover {
      transform: scale(1.08);

      box-shadow:
        0 8px 25px rgba(255, 92, 133, 0.5);
    }

    button:active {
      transform: scale(0.95);
    }

    /* Hide elements */

    .hidden {
      display: none;
    }

    /* Floating decorations */

    .decoration {
      position: absolute;

      bottom: -50px;

      font-size: 20px;

      opacity: 0;

      pointer-events: none;

      animation: floatUp linear infinite;
    }

    @keyframes floatUp {

      0% {
        transform:
          translateY(0)
          rotate(0deg)
          scale(0.7);

        opacity: 0;
      }

      10% {
        opacity: 0.8;
      }

      50% {
        opacity: 0.9;
      }

      100% {
        transform:
          translateY(-110vh)
          rotate(180deg)
          scale(1.2);

        opacity: 0;
      }
    }

    /* Mobile */

    @media (max-width: 600px) {

      .sticker {
        width: 140px;
        height: 140px;
      }

      button {
        font-size: 1rem;
        padding: 11px 28px;
      }

    }
  </style>
</head>

<body>

  <div id="content">

    <div id="question" class="question"></div>

    <img
      id="sticker"
      class="sticker hidden"
      src=""
      alt="Cute picture"
    >

    <div id="final" class="final hidden">
      Maybe this is just the beginning... 🖤
    </div>

    <button id="nextBtn">
      Next →
    </button>

  </div>


  <script>

    /*
      ==========================================
      YOUR MESSAGES
      ==========================================
    */

    const questions = [

      "Hey cutie, how’s your day going? 🌸",

      "Think you could get used to a little extra affection from me? 🥰",

      "Careful... I might end up spoiling you. 🧸",

      "Let’s make some memories together on the 26th. ✨",

      "And who knows... maybe the 26th will change something between us. 👀🖤"

    ];


    /*
      ==========================================
      YOUR IMAGES
      ==========================================
      
      Make sure these files are in the
      SAME folder as index.html.
    */

   const stickers = [
  "1.jpg",
  "2.jpg",
  "3.jpeg",
  "4.jpeg",
  "5.jpeg"
];


    /*
      ==========================================
      ELEMENTS
      ==========================================
    */

    let step = 0;

    const questionEl =
      document.getElementById("question");

    const stickerEl =
      document.getElementById("sticker");

    const finalEl =
      document.getElementById("final");

    const nextBtn =
      document.getElementById("nextBtn");


    /*
      ==========================================
      SHOW EACH PAGE
      ==========================================
    */

    function showStep() {

      if (step < questions.length) {

        // Change the message
        questionEl.textContent =
          questions[step];


        // Change the picture
        stickerEl.src =
          stickers[step];


        // Show picture
        stickerEl.classList.remove("hidden");


        // Restart animations
        questionEl.style.animation = "none";
        stickerEl.style.animation = "none";

        void questionEl.offsetWidth;
        void stickerEl.offsetWidth;

        questionEl.style.animation =
          "questionAppear 0.8s ease";

        stickerEl.style.animation =
          "stickerAppear 0.7s ease";


        // Change button text on last message
        if (step === questions.length - 1) {

          nextBtn.textContent =
            "One more thing... 💗";

        } else {

          nextBtn.textContent =
            "Next →";

        }


        step++;

      } else {

        // Hide previous content
        questionEl.classList.add("hidden");

        stickerEl.classList.add("hidden");


        // Show final message
        finalEl.classList.remove("hidden");


        // Hide button
        nextBtn.style.display = "none";

      }

    }


    /*
      ==========================================
      BUTTON
      ==========================================
    */

    nextBtn.addEventListener(
      "click",
      showStep
    );


    /*
      ==========================================
      FLOATING DECORATIONS
      ==========================================
      
      Instead of black hearts,
      we use cute mixed decorations.
    */

    const decorations = [
      "♡",
      "✦",
      "✧",
      "🌸",
      "💗",
      "⋆",
      "♡",
      "✨"
    ];


    for (let i = 0; i < 35; i++) {

      const decoration =
        document.createElement("div");

      decoration.classList.add(
        "decoration"
      );


      decoration.textContent =
        decorations[
          Math.floor(
            Math.random() *
            decorations.length
          )
        ];


      decoration.style.left =
        Math.random() * 100 + "vw";


      decoration.style.fontSize =
        (12 + Math.random() * 20) + "px";


      decoration.style.animationDuration =
        (6 + Math.random() * 7) + "s";


      decoration.style.animationDelay =
        (Math.random() * 7) + "s";


      document.body.appendChild(
        decoration
      );

    }


    /*
      ==========================================
      START
      ==========================================
    */

    showStep();

  </script>

</body>
</html>
